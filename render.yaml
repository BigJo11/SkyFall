# Render Blueprint for SKYFALL.
# In Render: New + > Blueprint > pick this repo. Everything below is applied
# automatically. Keep the service on ONE instance: match state lives in memory,
# so extra instances would split players into separate arenas.
services:
  - type: web
    name: skyfall
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"
